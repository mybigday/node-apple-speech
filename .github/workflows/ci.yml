name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test on macOS
    runs-on: macos-26

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20
          - 22

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Show toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          swiftc -version
          node -v
          npm -v

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Pack release tarball
        run: npm run release -- --skip-tests
